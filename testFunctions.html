<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI API Function Calling Example</title>
    <script>
        async function fetchWeather() {
            try {
                // Define the function schema
                const functionDefinition = {
                    "name": "get_weather",
                    "description": "Fetches weather information for a given location and date",
                    "parameters": {
                        "location": "Paris",
                        "date": "tomorrow"
                    }
                };

                // Mock API call to localhost:3000/api/weather
                const response = await fetch('http://localhost:3000/api/weather', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        location: functionDefinition.parameters.location,
                        date: functionDefinition.parameters.date
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error: ${response.status}`);
                }

                const weatherData = await response.json();

                // Display the result
                document.getElementById('output').textContent =
                    `Weather in ${functionDefinition.parameters.location} on ${functionDefinition.parameters.date}: ${weatherData.forecast}`;

            } catch (error) {
                console.error('Error fetching weather:', error);
                document.getElementById('output').textContent = 'Error fetching weather data.';
            }
        }

        // Call the function on page load
        window.onload = fetchWeather;
    </script>
</head>
<body>
    <h1>OpenAI API Function Calling Example</h1>
    <p id="output">Loading weather data...</p>
</body>
</html>
